# ====================================================
# Dah Tech API - Application Configuration
# ====================================================

# Server
server.port=8080
spring.application.name=dahtech-api

# ---- Database (PostgreSQL) ----
spring.datasource.url=jdbc:postgresql://localhost:5432/dahtech_db
spring.datasource.username=${DB_USERNAME:dahtech_user}
spring.datasource.password=${DB_PASSWORD:your_strong_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ---- JWT Configuration ----
# IMPORTANT: In production, use a strong randomly-generated secret (>256 bits)
# and store it as an environment variable, never hardcode it.
app.jwt.secret=${JWT_SECRET:DahTech_Super_Secret_Key_Replace_In_Production_2024!}
app.jwt.expiration-ms=86400000

# ---- QR Code Quick-Delete Security Token ----
# This token is sent in the QR code URL to authenticate the scan
# It does NOT require the admin to be logged in (shop cashier scans it)
app.qr.secret-token=${QR_SECRET:DahTech-QR-Delete-Token-2024}

# ---- Application Base URL (used in QR code generation) ----
app.base-url=${APP_BASE_URL:https://dahtech.com}

# ---- File Upload (for product images) ----
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ---- CORS (Adjust for production domain) ----
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,https://dahtech.com}

# ---- Logging ----
logging.level.com.dahtech=INFO
logging.level.org.springframework.security=WARN

# ---- SpringDoc / Swagger UI ----
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
